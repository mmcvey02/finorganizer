name: Build Windows and macOS apps

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Stamp version
        shell: pwsh
        run: |
          $base = python -c "import finorganizer as f; print('.'.join(f.__version__.split('.')[:2]))"
          $version = "$base.$env:GITHUB_RUN_NUMBER"
          "VERSION = `"$version`"" | Out-File -Encoding utf8 finorganizer/_build.py
          Write-Host "Building FinOrganizer $version"

      - name: Build FinOrganizer.exe and FinOrganizer-cli.exe
        run: |
          python -m pip install --upgrade pip pyinstaller pywebview truststore certifi
          python packaging/build_exe.py

      - name: Smoke-test the command-line executable
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP "smoke.db"
          dist\FinOrganizer-cli.exe --db $db demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\FinOrganizer-cli.exe --db $db report summary
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process dist\FinOrganizer-cli.exe -ArgumentList "--db", $db, "serve", "--port", "8799" -PassThru
          Start-Sleep -Seconds 5
          $page = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
          $api = Invoke-WebRequest http://127.0.0.1:8799/api/accounts -UseBasicParsing
          Stop-Process -Id $p.Id
          if (-not $page.Content.Contains("FinOrganizer") -or $api.StatusCode -ne 200) { exit 1 }

      - name: Smoke-test the desktop app (opens its window, renders, closes, exits)
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP "smoke.db"
          $p = Start-Process dist\FinOrganizer.exe -ArgumentList "--db", $db, "--smoke-test" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; Write-Error "desktop app did not exit"; exit 1 }
          Write-Host "desktop app exit code: $($p.ExitCode)"
          $log = Join-Path $env:RUNNER_TEMP "finorganizer-desktop.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Error "smoke test wrote no log"; exit 1 }
          if ($p.ExitCode -ne 0) { exit 1 }
          Start-Sleep -Seconds 2
          if (Get-Process -Name FinOrganizer -ErrorAction SilentlyContinue) { Write-Error "process still running after window closed"; exit 1 }
          try { Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 3; Write-Error "server still running"; exit 1 } catch { Write-Host "server stopped" }

      - name: Test self-update (replace the program while it is running)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "upd"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item dist\FinOrganizer.exe "$dir\FinOrganizer.exe"
          $db = Join-Path $env:RUNNER_TEMP "upd.db"
          $p = Start-Process "$dir\FinOrganizer.exe" -ArgumentList "--db", $db, "--smoke-test" -PassThru
          Start-Sleep -Seconds 3
          # As in a real update: the new version is downloaded while the app is running.
          Copy-Item dist\FinOrganizer.exe "$dir\FinOrganizer.exe.new"
          python -c "from finorganizer import updater; updater._swap_file(r'$dir\FinOrganizer.exe.new', r'$dir\FinOrganizer.exe')"
          if ($LASTEXITCODE -ne 0) { Write-Error "swap failed while running"; exit 1 }
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; exit 1 }
          if (-not (Test-Path "$dir\FinOrganizer.exe.old")) { Write-Error "old copy missing"; exit 1 }
          # The swapped-in program must start, work, and remove the leftover .old file.
          $q = Start-Process "$dir\FinOrganizer.exe" -ArgumentList "--db", $db, "--smoke-test" -PassThru
          if (-not $q.WaitForExit(120000)) { Stop-Process -Id $q.Id -Force; exit 1 }
          if ($q.ExitCode -ne 0) { Write-Error "updated program failed"; exit 1 }
          Start-Sleep -Seconds 2
          if (Test-Path "$dir\FinOrganizer.exe.old") { Write-Error "leftover .old not cleaned up"; exit 1 }
          $archive = Join-Path $env:APPDATA "FinOrganizer\previous-versions"
          $kept = Get-ChildItem $archive -Filter "FinOrganizer-*.exe" -ErrorAction SilentlyContinue
          if (-not $kept) { Write-Error "previous build was not moved into $archive"; exit 1 }
          Write-Host "previous build kept as $($kept.FullName)"
          Write-Host "self-update swap OK"

      - uses: actions/upload-artifact@v4
        with:
          name: FinOrganizer-windows
          path: |
            dist/FinOrganizer.exe
            dist/FinOrganizer-cli.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1 and later)
            label: apple-silicon
          - runner: macos-15-intel    # Intel Macs
            label: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Stamp version
        run: |
          base=$(python -c "import finorganizer as f; print('.'.join(f.__version__.split('.')[:2]))")
          version="$base.$GITHUB_RUN_NUMBER"
          echo "VERSION = \"$version\"" > finorganizer/_build.py
          echo "Building FinOrganizer $version for $(uname -m)"

      - name: Build FinOrganizer.app
        run: |
          python -m pip install --upgrade pip pyinstaller pywebview truststore certifi
          python packaging/build_exe.py desktop

      - name: Smoke-test the app (opens its window, renders, closes, exits)
        run: |
          db="$RUNNER_TEMP/smoke.db"
          dist/FinOrganizer.app/Contents/MacOS/FinOrganizer --db "$db" --smoke-test &
          pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill -9 $pid; echo "::error::app did not exit"; exit 1; fi
          wait $pid; code=$?
          echo "app exit code: $code"
          cat "$RUNNER_TEMP/finorganizer-desktop.log" || { echo "::error::smoke test wrote no log"; exit 1; }
          [ "$code" = 0 ] || exit 1
          sleep 2
          if curl -s --max-time 3 http://127.0.0.1:8765/ >/dev/null; then echo "::error::server still running"; exit 1; fi

      - name: Make .dmg
        run: |
          chmod +x packaging/make_dmg.sh
          packaging/make_dmg.sh "dist/FinOrganizer-mac-${{ matrix.label }}.dmg"

      - name: Test self-update with the real macOS tools
        run: |
          apps="$RUNNER_TEMP/Applications"; mkdir -p "$apps"
          ditto dist/FinOrganizer.app "$apps/FinOrganizer.app"
          touch "$apps/FinOrganizer.app/Contents/old-version-marker"
          python -c "from finorganizer import updater; updater._install_mac_from_dmg('dist/FinOrganizer-mac-${{ matrix.label }}.dmg', '$apps/FinOrganizer.app')"
          test ! -e "$apps/FinOrganizer.app/Contents/old-version-marker" || { echo "::error::app was not replaced"; exit 1; }
          test -e "$apps/.FinOrganizer.app.old/Contents/old-version-marker" || { echo "::error::old copy missing"; exit 1; }
          codesign --verify --deep --strict "$apps/FinOrganizer.app"
          # The updated app must start, work, and remove the leftover old copy.
          "$apps/FinOrganizer.app/Contents/MacOS/FinOrganizer" --db "$RUNNER_TEMP/upd.db" --smoke-test &
          pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill -9 $pid; echo "::error::updated app did not exit"; exit 1; fi
          wait $pid || { echo "::error::updated app failed"; exit 1; }
          sleep 2
          test ! -e "$apps/.FinOrganizer.app.old" || { echo "::error::leftover old copy not cleaned up"; exit 1; }
          archive="$HOME/Library/Application Support/FinOrganizer/previous-versions"
          ls -d "$archive"/FinOrganizer-*.app || { echo "::error::previous build was not moved into $archive"; exit 1; }
          echo "self-update with real hdiutil/ditto/codesign OK"

      - uses: actions/upload-artifact@v4
        with:
          name: FinOrganizer-mac-${{ matrix.label }}
          path: dist/FinOrganizer-mac-${{ matrix.label }}.dmg

  # The iPhone / web version: a static site running the same Python code in the browser.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version
        run: |
          base=$(python -c "import finorganizer as f; print('.'.join(f.__version__.split('.')[:2]))")
          echo "VERSION = \"$base.$GITHUB_RUN_NUMBER\"" > finorganizer/_build.py

      - name: Get Pyodide
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'packaging'); import build_web; print(build_web.PYODIDE_VERSION)")
          npm pack "pyodide@$version"
          tar xzf "pyodide-$version.tgz"

      - name: Build the web app
        run: python packaging/build_web.py --pyodide-dir package --out dist/web

      - name: Smoke-test it on Pyodide
        run: node packaging/test_web.mjs dist/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  # Publish the web app on GitHub Pages (https://<owner>.github.io/<repo>/).
  pages:
    needs: web
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Every build of the default branch becomes a release (only if all builds passed);
  # the app's update checker looks at the latest one.
  release:
    needs: [windows, macos]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version and release notes
        id: version
        run: |
          base=$(python3 -c "import finorganizer as f; print('.'.join(f.__version__.split('.')[:2]))")
          echo "version=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          # The commit message without its trailer lines.
          git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          pattern: FinOrganizer-*  # the app downloads, not the web app's Pages bundle
          path: release-files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FinOrganizer ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          files: release-files/*
