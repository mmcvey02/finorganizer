[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finorganizer"
version = "1.2.0"
description = "Personal finance tracker: accounts, budgets, goals, bills, reports and planning calculators."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=5", "truststore>=0.9", "certifi"]

[project.scripts]
finorganizer = "finorganizer.cli:main"

[project.gui-scripts]
finorganizer-desktop = "finorganizer.desktop:main"

[tool.setuptools]
packages = ["finorganizer"]

[tool.setuptools.package-data]
finorganizer = ["static/*"]
