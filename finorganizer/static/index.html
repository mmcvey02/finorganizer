<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinOrganizer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">FinOrganizer <span id="app-version" class="version"></span></div>
  <nav id="nav">
    <a href="#dashboard">Dashboard</a>
    <a href="#transactions">Transactions</a>
    <a href="#accounts">Accounts</a>
    <a href="#budgets">Budgets</a>
    <a href="#goals">Goals</a>
    <a href="#recurring">Bills</a>
    <a href="#reports">Reports</a>
    <a href="#planning">Planning</a>
  </nav>
  <div class="top-actions">
    <select id="profile-select" aria-label="Profile" title="Switch profile"></select>
    <button id="print-btn" class="ghost" title="One-page printable summary">Print</button>
    <button id="theme-toggle" class="ghost" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
    <a id="settings-btn" class="btn ghost-link" href="#settings" title="Settings, profiles & updates" aria-label="Settings">⚙</a>
  </div>
</header>
<div id="update-banner" role="status" hidden></div>
<main id="view" aria-live="polite"></main>
<div id="toast" role="status"></div>
<dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
<div id="tooltip" role="tooltip"></div>
<script src="/app.js"></script>
</body>
</html>
